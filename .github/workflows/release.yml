name: Release Ariadne

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: ariadne-connector-windows-amd64.exe
            package: ./cmd/ariadne-connector
          - goos: windows
            goarch: arm64
            asset: ariadne-connector-windows-arm64.exe
            package: ./cmd/ariadne-connector
          - goos: linux
            goarch: amd64
            asset: ariadne-connector-linux-amd64
            package: ./cmd/ariadne-connector
          - goos: linux
            goarch: arm64
            asset: ariadne-connector-linux-arm64
            package: ./cmd/ariadne-connector
          - goos: android
            goarch: arm64
            asset: ariadne-connector-android-arm64
            package: ./cmd/ariadne-connector
          - goos: linux
            goarch: amd64
            asset: ariadne-mcp-linux-amd64
            package: ./cmd/ariadne-mcp
          - goos: linux
            goarch: arm64
            asset: ariadne-mcp-linux-arm64
            package: ./cmd/ariadne-mcp
          - goos: windows
            goarch: amd64
            asset: ariadne-mcp-windows-amd64.exe
            package: ./cmd/ariadne-mcp
          - goos: linux
            goarch: amd64
            asset: ariadne-relay-linux-amd64
            package: ./cmd/ariadne-relay
          - goos: linux
            goarch: arm64
            asset: ariadne-relay-linux-arm64
            package: ./cmd/ariadne-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.asset }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "dist/${{ matrix.asset }}" \
            ${{ matrix.package }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_TAG}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --prerelease
          --title "Ariadne ${RELEASE_TAG}"
