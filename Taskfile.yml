version: '3'

dotenv:
  - .env.local
  - .env

vars:
  BIN_DIR: bin
  DIST_DIR: dist
  MANAGEMENT_RELAY: '{{default "http://127.0.0.1:8088" .ARIADNE_MANAGEMENT_RELAY}}'
  MANAGEMENT_TOKEN_FILE: '{{default "" .ARIADNE_MANAGEMENT_TOKEN_FILE}}'
  NODE_RELAY: '{{default "http://127.0.0.1:47471" .ARIADNE_NODE_RELAY}}'
  NODE_RELAY_SSH: '{{default "" .ARIADNE_NODE_RELAY_SSH}}'
  NODE_RELAY_CERT_PIN: '{{default "" .ARIADNE_NODE_RELAY_CERT_PIN}}'
  NODE_RELAY_FALLBACK: '{{default "auto" .ARIADNE_NODE_RELAY_FALLBACK}}'
  MANAGEMENT_LISTEN: '{{default "127.0.0.1:8088" .ARIADNE_MANAGEMENT_LISTEN}}'
  NODE_LISTEN: '{{default "127.0.0.1:47471" .ARIADNE_NODE_LISTEN}}'
  NODE_LOOPBACK_LISTEN: '{{default "" .ARIADNE_NODE_LOOPBACK_LISTEN}}'
  NODE_QUIC_LISTEN: '{{default "" .ARIADNE_NODE_QUIC_LISTEN}}'
  NODE_TLS_CERT: '{{default "" .ARIADNE_NODE_TLS_CERT}}'
  NODE_TLS_KEY: '{{default "" .ARIADNE_NODE_TLS_KEY}}'
  NODE_ALIAS: '{{default "" .ARIADNE_ALIAS}}'
  NODE: '{{default "phone" .ARIADNE_ALIAS}}'
  ARCH: arm64

tasks:
  default:
    desc: Show the available tasks
    silent: true
    cmd: task --list

  fmt:
    desc: Format Go sources
    cmd: go fmt ./...

  test:
    desc: Run the test suite
    cmd: go test ./...

  test:race:
    desc: Run the test suite with the race detector
    cmd: go test -race ./...

  vet:
    desc: Run Go static analysis
    cmd: go vet ./...

  check:
    desc: Run tests, static analysis, and a local build
    cmds:
      - task: test:race
      - task: vet
      - task: build

  build:
    desc: Build the local CLI, MCP server, relay, connector, and break-glass utility
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - go build -o "{{.BIN_DIR}}/ari" ./cmd/ari
      - go build -o "{{.BIN_DIR}}/ariadne-mcp" ./cmd/ariadne-mcp
      - go build -o "{{.BIN_DIR}}/ariadne-relay" ./cmd/ariadne-relay
      - go build -o "{{.BIN_DIR}}/ariadne-connector" ./cmd/ariadne-connector
      - go build -o "{{.BIN_DIR}}/ssh-breakglass" ./cmd/ssh-breakglass

  build:android:
    desc: Build the connector and CLI for Android/Termux (ARCH=arm64 by default)
    env:
      CGO_ENABLED: '0'
      GOOS: android
      GOARCH: '{{.ARCH}}'
    cmds:
      - mkdir -p "{{.DIST_DIR}}"
      - go build -trimpath -o "{{.DIST_DIR}}/ariadne-connector-android-{{.ARCH}}" ./cmd/ariadne-connector
      - go build -trimpath -o "{{.DIST_DIR}}/ari-android-{{.ARCH}}" ./cmd/ari

  build:linux-arm64:
    desc: Build static Linux/ARM64 connector and CLI binaries
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm64
    cmds:
      - mkdir -p "{{.DIST_DIR}}"
      - go build -trimpath -o "{{.DIST_DIR}}/ariadne-connector-linux-arm64" ./cmd/ariadne-connector
      - go build -trimpath -o "{{.DIST_DIR}}/ari-linux-arm64" ./cmd/ari

  relay:
    desc: Build and run the relay
    deps: [build]
    cmd: '"{{.BIN_DIR}}/ariadne-relay" --management-listen "{{.MANAGEMENT_LISTEN}}" --node-listen "{{.NODE_LISTEN}}" {{if .NODE_LOOPBACK_LISTEN}}--node-loopback-listen "{{.NODE_LOOPBACK_LISTEN}}"{{end}} {{if .NODE_QUIC_LISTEN}}--node-quic-listen "{{.NODE_QUIC_LISTEN}}"{{end}} {{if .NODE_TLS_CERT}}--node-tls-cert "{{.NODE_TLS_CERT}}"{{end}} {{if .NODE_TLS_KEY}}--node-tls-key "{{.NODE_TLS_KEY}}"{{end}} {{if .MANAGEMENT_TOKEN_FILE}}--management-token-file "{{.MANAGEMENT_TOKEN_FILE}}"{{end}} {{.CLI_ARGS}}'

  mcp:
    desc: Run the Ariadne stdio MCP server
    deps: [build]
    cmd: '"{{.BIN_DIR}}/ariadne-mcp" --relay "{{.MANAGEMENT_RELAY}}" {{if .MANAGEMENT_TOKEN_FILE}}--management-token-file "{{.MANAGEMENT_TOKEN_FILE}}"{{end}} {{.CLI_ARGS}}'

  connector:
    desc: Build and run a connector (hostname alias by default; NODE_ALIAS overrides)
    deps: [build]
    cmd: '"{{.BIN_DIR}}/ariadne-connector" --relay "{{.NODE_RELAY}}" {{if .NODE_RELAY_SSH}}--relay-ssh "{{.NODE_RELAY_SSH}}"{{end}} {{if .NODE_RELAY_CERT_PIN}}--relay-cert-pin "{{.NODE_RELAY_CERT_PIN}}"{{end}} --relay-fallback "{{.NODE_RELAY_FALLBACK}}" {{if .NODE_ALIAS}}--alias "{{.NODE_ALIAS}}"{{end}} {{.CLI_ARGS}}'

  nodes:
    desc: List nodes currently connected to the relay
    deps: [build]
    cmd: '"{{.BIN_DIR}}/ari" --relay "{{.MANAGEMENT_RELAY}}" {{if .MANAGEMENT_TOKEN_FILE}}--management-token-file "{{.MANAGEMENT_TOKEN_FILE}}"{{end}} nodes'

  claim:
    desc: Claim NODE_ALIAS for an online NODE_ID
    deps: [build]
    preconditions:
      - sh: test -n "{{.NODE_ID}}"
        msg: Pass NODE_ID from task nodes
    cmd: '"{{.BIN_DIR}}/ari" --relay "{{.MANAGEMENT_RELAY}}" {{if .MANAGEMENT_TOKEN_FILE}}--management-token-file "{{.MANAGEMENT_TOKEN_FILE}}"{{end}} claim "{{.NODE_ID}}" "{{.NODE_ALIAS}}"'

  shell:
    desc: Open the zero-config shell on NODE=phone
    deps: [build]
    cmd: '"{{.BIN_DIR}}/ari" --relay "{{.MANAGEMENT_RELAY}}" {{if .MANAGEMENT_TOKEN_FILE}}--management-token-file "{{.MANAGEMENT_TOKEN_FILE}}"{{end}} shell "{{.NODE}}"'

  exec:
    desc: Run a command on NODE=phone; pass it after --
    deps: [build]
    cmd: '"{{.BIN_DIR}}/ari" --relay "{{.MANAGEMENT_RELAY}}" {{if .MANAGEMENT_TOKEN_FILE}}--management-token-file "{{.MANAGEMENT_TOKEN_FILE}}"{{end}} exec {{.EXEC_FLAGS}} "{{.NODE}}" -- {{.CLI_ARGS}}'
