# Permit a short-lived password only for the dedicated break-glass account.
# This file must sort before the global key-only policy.
Match User breakglass
    AuthenticationMethods password
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
    PubkeyAuthentication no

    AllowAgentForwarding no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:14771 127.0.0.1:23771 127.0.0.1:47471 127.0.0.1:8088
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no

Match all
